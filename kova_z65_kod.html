<!DOCTYPE html>

<body>
    <div id="pierwszy_kovalchuk">
        <p>Pierwszy akapit/pierwszy DIV--> Kovalchuk <br>
            nazwa ID akapitu id="pierwszy_kovalchuk"</p>
        <p>Drugi akapit/pierwszy DIV <br>
            pierwszy akapit --> p:first-child{font-size:7mm;font-style:italic;} <br>
            bo numer nieparzysty w dzienniku <br>
            pozostałe akapity --> p{font-size:11pt;} bo numer nieparzysty <br>
            szerokość bloku = 700+10*4=744pt <br>
            pierwszy DIV--> kolor różowy</p>
        <p>trzeci akapit/pierwszy DIV <br>
            pierwszy DIV--> obramowanie fioletowy DIV <br>
            pierwszy DIV--> obramowanie grubość 7px, ciągłe (solid) <br>
            pierwszy DIV--> r1=7mm+7(Tymofii)=14mm </p>
    </div>
    <div id="drugi_kovalchuk">
        <p>Pierwszy akapit/drugi DIV--> Tymofii <br>
            nazwa ID akapitu id="drugi_kovalchuk"</p>
        <p>Drugi akapit/drugi DIV <br>
            drugi DIV--> kolor jasno zielony</p>
        <p>trzeci akapit/drugi DIV <br>
            drugi DIV--> obramowanie  czarny DIV <br>
            drugi DIV--> obramowanie grubość 3px, ciągłe (solid) <br>
            drugi DIV--> r2=7mm+9(Kovalchuk)=16mm</p>
    </div>
    <div id="trzeci_kovalchuk">
        <p>Pierwszy akapit/trzeci DIV--> klasa 1P nazwa ID akapitu id="trzeci_kovalchuk"</p>
        <p>Drugi akapit/trzeci DIVbr <br>
            trzeci DIV--> kolor jasno niebieski</p>
        <p>trzeci akapit/trzeci DIV(solid) <br>
            trzeci DIV--> obramowanie granatowy DIV <br>
            trzeci DIV--> obramowanie grubość 5px, ciągłe (solid) <br>
            trzeci DIV--> r3=7mm+11(listopad)=18mm</p>
    </div>
</body>
</html>
